name: Feature request
description: Suggest an idea for this project
labels: enhancement
body:
  - type: markdown
    attributes:
      value: "## Feature Request"
  - type: input
    id: title
    attributes:
      label: Title
      description: Short summary of the feature
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature in detail
    validations:
      required: true