name: Bug report
description: Create a report to help us improve
labels: bug
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: input
    id: title
    attributes:
      label: Title
      description: Short summary of the bug
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug in detail
    validations:
      required: true