name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5.1.0
        with:
          go-version: '1.26.2'
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./tests/...
      - run: docker build .
